[plugin]
id = "hoi4_advisor"
name = "钢四参谋"
type = "plugin"
description = "《钢铁雄心4》参谋兼代手，外加一个「按住说话」：一边读存档让猫娘看懂你这局的局势（盟友部队赖在你国土上、政治点攒到溢出、某州堆太多师补给跟不上，这些界面上看不见的东西她能直接说出来），一边能真的替你动手——选国策（国家焦点）、把师调到指定省份、给某支部队划防线和进攻线、看某个地方附近有哪些部队（说国名或地名，敌我都报，从内存里读实时位置）。打游戏时不用切出来：在游戏里按住一个键说话，松开后由插件自己在本地识别成文字（自带离线识别模型，不走宿主那套语音识别），识别出来的话**直接出现在猫娘聊天窗里**，她的回答也在同一个聊天窗里，声音由她自己念。开着对话框打游戏就能看见双方说了什么，游戏画面上不再浮字幕条。说话键是插件用系统级热键独占的——按住它的时候游戏根本收不到这个键，不会出现「说了一句话、游戏里同时被下了一道指令」这种事。还能用嘴下令：说「把华沙的师调到柏林」「在柏林划一条防线」「柏林附近有什么部队」，认得出来就当场动手，不用等模型想；认不出来当普通聊天。进入游戏时宿主那套全局快捷键会自动让出来，F7 不再弹聊天框；关掉游戏后自动恢复。说「体检」她能自查游戏开没开、代理注入没有、本地识别模型装没装、说话键抢到没有、游戏闸门接管没有、版本新旧，每步带下一步指引。划线是直接改游戏里的战区前线对象再叫引擎自己重算，跟你在地图上画一样，但全程不抢鼠标键盘、不拉你的视角。调兵会先按陆地邻接算整条行军路线，不会穿海瞬移。全程玩家身份，不走控制台、不改存档、不影响成就。看前线时还能读出每块地现在归谁控制、法理上属于谁，以及每场陆战攻方守方各是哪些国家、各投入几个师；只报本国、盟友、敌对国这些参与你这局战争的国家，别处的仗不会混进来。开局把相关交火、参战国控制省数，连同一份兵力架构（集团军群下辖几个集团军、各集团军多少师、每个师的中文番号和位置）一起交给猫娘，让她做一段汇报；之后参战国省份易主，哨兵会主动报「某某推进到了某省」。0.9.5 修好了查询超时和海战误判：查前线/编制不再白扫一遍全师列表，战斗列表只收陆战。0.9.6 让猫娘真的开口做汇报：chat 的会话 id 对齐 route/start，成功响应按 line 判定。0.9.7 修查询再次超时：后台哨兵与工具共用 DLL 全局命令锁，改成工具优先、哨兵低频扫描、缓存换局自动失效。0.9.8 把存档识别做实：只读 8 KB 文件头就认出是哪一局（玩家国、日期、版本、局唯一 ID），比对游戏进程启动时间判出「这局还没存过盘」，横幅直接写清隔了多少天、是不是同一局；二进制存档和写了一半的残档在选档阶段就挡掉；顺手修了版本串抠错导致拿 1.16 的数据读 1.14 的存档、师缺编拿绝对兵力当百分比、指挥点硬说满值 100 这几处报错数字，并给快照加了「读全没读全」的自检。0.9.9 只报参战国的战况：以前全服陆战和全服省份易主都照单端出来，玩家在欧洲也会收到东亚的兵力调动；现在按「跟玩家同场并肩或对阵」认出本国/盟友/敌对国，无关国家的交火、占领、增兵一律不报也不汇总。同时把游戏简体中文汉化文件和番号组接进来，开局顺带给她一份兵力架构：集团军群下辖几个集团军、名字是什么，集团军带几个师、每个师叫什么、在哪，师名按番号组拼出来再翻成中文；另加 hoi4_order_of_battle 工具随时查。0.9.10 补掉元数据漏报：全服交火计数、全服省数这类内部诊断数字不再进模型上下文，别处的仗连数字都不给她。0.9.11 修好「读错存档」：便携版（绿色版）游戏把存档写在自己安装目录下的 Paradox Interactive 里、且默认是二进制格式，以前插件只扫 Documents，会一直拿几个月前另一局的旧文本档当现状报；现在按「正在运行的游戏进程目录」找存档，认准 mtime 最新的那份就是当前这局——哪怕它是读不了的二进制档，也如实告诉用户「这是二进制存档，重开一次游戏、手动存一次就能读」，并在游戏关掉时自动把 save_as_binary 改成 no（带备份），下次进游戏存档即文本、可直接解析。实时战况（前线、部队、编制图标）不依赖存档，照常可用。0.9.15 让她真的能接管一支部队：说「我把第9集团军指挥权给你」，她按存档里的编组名册（哪几个师属于这个军）到内存里按师 id 找到那批师，把指挥权接过来；说「你看一下欧洲西部海岸线」，她把法国/比利时/荷兰的沿海省摊开报——哪段有多少师、哪段空着、岸上有别国多少兵；说「看看这支部队能打哪」，她对着实时分布表算弱点（邻省守军多少、我方能压几个师）；「守这条线」「开始进攻」「停手」「还给你」都能办。写侧只用引擎自己的调兵函数（进程内，不碰鼠标、不改存档），只打认出来的敌对国、没认出敌人就只报不动手，你手动动过的师她会自动让出、换局立刻交回指挥权。0.9.16 顺手把上次说错的概念和多余的护栏都改了：从内存里找回了**集团军作战计划对象**（`CArmy+0xA0`，同一集团军的师全部指向同一个，20 个集团军 20 个不同指针，34 个未编组师为 0），并按 20 个集团军与存档逐字段全等对出了 `execution_type`（0 待命 / 1、2、4 执行中）、`cohesion_type`、`motorization_level`、成员师数、内联番号、所属战区——所以现在问「这支部队现在干嘛」她会照游戏里的真实状态回「第9集团军现在执行中」，不是猜的；同时撤掉「没认出敌对国就一个师都不动」这条多余护栏（引擎层面本来就打不了盟友），改成邻省有别人家的兵就算目标、盟友名单只用来把友军摘出去；分布表冷的时候也不再给「周围没口子」这种错答案，会现扫一次兜底。0.9.18 把脑子还给她：插件不再替她判断该打哪——原来那个「能压的师 − 2×守军」的评分排序拆掉了，改成只给她一份事实清单（我方几个师在哪、每个接邻的省里有哪国几个师、我方邻省能调多少师、这支部队现在是不是在执行计划），没有建议、没有排序、没有分数；战况有变化时哨兵主动把清单推给她，她用自己的一段话判断「我看到什么、打算怎么办、为什么」，你点头她才动手。自动进攻的开关关掉了（每轮只观察），守线的工具交到她手上——守哪些省由她点名，代码只负责怎么摆（按 0.9.17 从引擎实测反推的规则：每省保底一个、富余补够打、再富余给最激烈那条线、正在交火的师不抽走），够不着的省如实回传哪几个。顺手修了个真 bug：敌情里会冒出「德国 42 个师」——判断敌我用错了依据（看在不在接管名单里），现在按国籍判断。0.9.19 修掉一个会把**游戏崩掉**的 bug：特征码扫描器原来先问系统「这块内存读得动吗」再直接 memchr，但系统的回答会过期——游戏结算战斗、调兵、读档时会把堆还回去，扫描正好踩到就 C0000005 整个游戏没了（真机 11:00:15 崩过一次，崩溃栈顶就是 memchr）。现在改成每 1MB 先把内存复制进自己的缓冲区再找，读到无效页只会返回失败、跳过那一页。用真实竞态验证过：旧版 400 轮内稳定复现 0xC0000005，新版扛了 6 万多次内存反复收放没有崩。现在她会记住自己下过的令后来怎么样了：每份简报开头多一行「上次（10:12）你让 3 个师去 阿巴斯港：2 个到了、1 个还在路上、1 个找不到了」——到了、在路上、被调去别处、被打散，四种结果都摆给她看，不打分也不说对错，因果得她自己看出来。另外按你的要求，战况播报（哪儿打起来了、哪儿易主）不再刷在聊天框里了：系统只悄悄记进她的笔记，等她自己开口、或者你问她的时候才带出来，聊天框现在只在她想说话时才会响。这一版修三个你报的问题。第一，「注入失败」是我的锅：注入其实一直是成功的，是上一版为了防崩溃把内存扫描改慢了三四倍（认国家要 20 秒），撞上 12 秒超时，她就跟你说「代理没注进去」——现在扫描换回全速方案，照样不会把游戏崩掉；第二，她偶尔会把工具调用的原始标记当正文吐到聊天窗里，现在提示词里焊死了「你只能说话」，加了一层兜底：认得出这类标记就不播；第三，她不守战线是因为在用一个一个搬师的老工具，简报提示词和工具说明都把思路引偏了，现在明确「整条防线用 hold 一次说完」，两个工具互相指路。0.10.0 加了世界资料库和一个引导界面：以前地图知识写死在一份按原版生成的数据里，换 TFR 这种把整张地图、州划分、省份编号全换掉的大 mod 就整体错位——她说「去华沙」会点到一个不相干的省。现在插件里存一个资料库，每个「世界」（游戏版本 + 一组启用的 mod）单独生成一份，面板上选要用哪个；点开引导页它会去读游戏目录和启动器留下的 mod 清单，把地图、州、国名、城市名都读进来存好，多少省、多少州、都叫什么名字一眼能看到，原版和带 mod 的可以各存一份随时切。换 mod 从此不用改代码，重新读一遍就行。0.10.1 补上「进攻」这个缺掉的动作。以前插件里只有「守线」和「把师调到某个省」两件事，没有「往前打一格」，于是她只能拿调兵冒充进攻：把师从防线上抽出来、跨好几个省扔进敌方纵深，结果是防线被抽空、单个师后路没人接、目标选得老远。现在多了一个动作叫推一格（action=advance）：你点一个紧挨着我们的敌省，它只让挨着那一格的部队去打，别处的守线部队一个都不动，出发省至少留一个师守家——守线的师照样能进攻，不用先撤下来，线也不会空。同时调兵会提示「这一单跨了 N 个省，中途没有接应」，并指回推一格。守线也多了一种说法：line 直接写「前线」，它会机械地算出所有挨着交战国的自家省（真机上是 28 个），再按摆兵规则铺上去——以前它只能反过来问你要省号。0.10.2 把玩家在地图上那三下做成了工具。第一件，能点名到师：存档里的中文番号（第3山地师）可以直接当句柄用——实测存档的 division id 和内存里的 uid 是同一套编号，122 个一个不差；units 参数三种写法都认（番号 / 兵种「装甲·山地·SS」/ uid），认不出来会如实说哪个词没认出来，不会悄悄少动几个师。第二件，点谁守哪里：hold 加 units，只动你点名的那几个师，别处的部队一个都不碰；顺带修掉一个老毛病——以前点名点到正在行军的师，它会回「手上的师都在路上，先不动」，现在点了名就照做。第三件，画进攻线：给一个目标加派哪几个师，这几个师就一格一格朝目标推。「下一格」用 0-1 BFS 算（走自己的省不花代价、走进别人的省记 1），所以永远是一格一格，不会把师扔到十个省外；保证填线靠三层：只派挨着那一格的师、出发省各留一个、上一格没打下来就不重复下令。线存在接管记录里，哨兵每轮自动往下推一格，重载后还在，offensive_stop 撤线。第四件，微操：advance 和 move 都支持 units，「某个师朝哪一点进攻」「只把某一个师绕到某个省」都成了一次调用。注意边界：代码只给这只手，**怎么用是你的判断**——几个师、从哪绕、什么时候合口，代码里没有「包抄」这种成品动作。0.11.0 把进攻线改成原游戏那样的**全线推进**。上一版是算一条最短路、取路径上第一格，用户当场否掉：「实现的效果是十几个师从一个宽度一省小缝隙里突入到敌军腹地」——路径式算法每次只认一个下一格，所以整个集团军永远从一个省宽的缺口往里钻。现在改成：有部队的每一个出发省，各找自己当面之敌（非我方邻省里离目标最近、且不比自己更远的那个），这些进攻同一轮里一起下达，推出去的是一整条带；已经压过去、身后成了自己地盘的省，让部队整个跟上新战线（后方不再挨着敌人，不留驻军——留 1 个的话每推一格就啃掉一个师，离线验证实测第三轮起全线只剩 1 个师）。前线省仍然各留 1 个填线，只剩 1 个师的省不推、如实报出来。离线网格验证：每轮推出去的省排成完整一列，战线连续，参战师一个不少。0.11.1 把读取 mod 这条链补全。以前只读启动器当前启用的 mod，而且 .mod 里的相对 path（比如插件自己发的 mod/yui_command）按进程工作目录解，插件跑在宿主目录里就解不到，那个 mod 被静默丢掉；路径解不出来的 mod 也只是 continue 跳过，界面上一个字都不说——世界 id 是按 mod 集合算的，少一个就是另一个世界。现在：相对 path 按用户目录解（Paradox 的惯例），换盘/搬家有兜底；面板给出**全量 mod 清单**，可以勾选任意几个直接建世界，不必先去启动器里启用它们；读不进来的 mod 连同原因一起显示出来。离线用磁盘上真实的 The Fire Rises 建了一份，14973 省 / 1444 州 / 562 国名 / 11500 条邻接，与已有数据逐项一致。0.11.2 把进攻线的推进判据从「跳数」换成「方向」。0.11.0 那版只推「邻省里离目标更近」的格子，在真实地图上 25 个前线省里只有 9 个满足，侧翼一个都不动，战线越推越窄成楔形——形状又回到了用户否掉的样子。现在用省的真实坐标算一条「从我们前线重心指向目标」的推进方向，每一格挑**沿这个方向最靠前**的敌邻去打，于是整条线是平移过去的；只有朝目标那侧一个敌邻都没有（投影≤0，等于往回打）才守着不动。拿磁盘上真实的原版地图（13375 省 / 9924 条邻接）离线验过：旧算法每轮只推 1 个省，新算法平均 4.2、最多 7 个省同时推，20 轮推了 41 个省，75 个参战师一个不少。"
version = "0.11.2"
entry = "plugin.plugins.hoi4_advisor:HoI4AdvisorPlugin"

[plugin.author]
name = "李文发"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "世界资料库"
entry = "static/index.html"
context = "hoi4_advisor"
permissions = ["state:read", "action:call"]

[plugin_runtime]
enabled = true
auto_start = true
