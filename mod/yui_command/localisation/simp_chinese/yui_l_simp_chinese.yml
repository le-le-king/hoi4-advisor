l_simp_chinese:
 yui_command:0 "YUI 参谋"
 yui_command_desc:0 "猫娘在这局里能替你做的事：接管几支部队、替你划防线和进攻线。她不动控制台，也不改存档。"
 yui_how_to:0 "YUI 怎么用（读一次就行）"
 yui_how_to_desc:0 "【接管部队】把鼠标放到你的部队上，按 F7。那个省里的师就归她指挥。按 F8 放回去。\n\n【划线】不用你按键，也不用你选部队。你跟她说「帮我守住柏林那一片」，她自己把这个国家战区里的防线改成那几个省，然后让游戏按新范围重算。你不用切窗口，视角也不会被拉走。\n\n【她只动你给她的】没按过 F7 的部队，她不会替你调；防线只改你自己战区的，别的国家一律不碰。\n\n【这些键在哪儿读的】按键是在游戏进程里读的，不用切窗口、也不用说话。按对了会听见一声提示音。"
